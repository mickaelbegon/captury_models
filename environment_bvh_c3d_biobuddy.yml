name: captury_biobuddy
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  # pyorerun 1.2.3 imports matplotlib.cm.get_cmap, removed in Matplotlib 3.10.
  - matplotlib<3.10
  - ezc3d
  - biorbd
  - pyorerun
  - rerun-sdk=0.21.0
  - pyside6
  - pip
  - pip:
      - biobuddy @ git+https://github.com/mickaelbegon/biobuddy.git@codex/add-model-editor-gui
